<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GoalPath" />
  <meta name="description" content="Visual goal and task planning, designed for an engineer's workflow." />
  <title>GoalPath — Visual Task Planner</title>
  <link rel="icon" type="image/png" href="./assets/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-theme="dark">
  <div class="app-shell">
    <header class="app-header">
      <button class="brand-button" data-action="go-home" aria-label="Go to goals">
        <span class="brand-mark" aria-hidden="true"><span class="brand-dot"></span></span>
        <span class="brand-name">Goal<span>Path</span></span>
      </button>
      <span class="top-label">VISUAL WORKSPACE</span>
      <button class="header-add icon-button" data-action="quick-add" aria-label="Create new goal or task" title="Create"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </header>
    <main id="app-main" class="main-content" aria-live="polite"></main>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation">
      <button data-nav="goals" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg><span>Goals</span></button>
      <button data-nav="today" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 15l2 2 5-5"/></svg><span>Focus</span></button>
      <button data-nav="calendar" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M13 14h3M8 18h3"/></svg><span>Calendar</span></button>
      <button data-nav="settings" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 2.7h3.4l.6 2.3c.5.2 1 .4 1.4.7l2.1-.9 2.4 2.4-.9 2.1c.3.4.5.9.7 1.4l2.3.6v3.4l-2.3.6c-.2.5-.4 1-.7 1.4l.9 2.1-2.4 2.4-2.1-.9c-.4.3-.9.5-1.4.7l-.6 2.3h-3.4l-.6-2.3c-.5-.2-1-.4-1.4-.7l-2.1.9-2.4-2.4.9-2.1a7 7 0 0 1-.7-1.4L1.7 14.7v-3.4l2.3-.6c.2-.5.4-1 .7-1.4l-.9-2.1 2.4-2.4 2.1.9c.4-.3.9-.5 1.4-.7z" transform="translate(0,0) scale(.98)"/><circle cx="12" cy="12" r="3"/></svg><span>Settings</span></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="backup-input" accept="application/json,.json" hidden />
  <script type="module" src="./app.js"></script>
</body>
</html>
